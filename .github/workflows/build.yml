name: KMP Project Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android-desktop:
    name: Build Android & Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew


      - name: Run Common, Android and Desktop Tests
        run: ./gradlew :composeApp:allTests

      - name: Build Android Debug
        run: ./gradlew :composeApp:assembleDebug

      - name: Build Desktop JVM
        run: ./gradlew :composeApp:assemble

  check-ios:
    name: Check iOS Compilation
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Check iOS Kotlin Compilation
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64